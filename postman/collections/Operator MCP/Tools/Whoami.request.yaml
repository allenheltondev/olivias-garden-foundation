$kind: http-request
name: Whoami
description: |-
  whoami returns the key's label, scopes, expiry and its operator's email, never the Cognito sub.
method: POST
url: '{{mcpUrl}}'
order: 2010
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: 'application/json, text/event-stream'
  - key: MCP-Protocol-Version
    value: '{{protocolVersion}}'
  - key: Mcp-Method
    value: tools/call
  - key: Mcp-Name
    value: whoami
  - key: Authorization
    value: 'Bearer {{mcpKey}}'
body:
  type: json
  content: |-
    {"jsonrpc": "2.0", "id": 2, "method": "tools/call", "params": {"name": "whoami", "arguments": {}, "_meta": {"io.modelcontextprotocol/protocolVersion": "{{protocolVersion}}", "io.modelcontextprotocol/clientCapabilities": {}}}}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get("mcpKey") && !pm.environment.get("mcpKey")) {
          console.log("mcpKey not set; skipping authenticated MCP request.");
          pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Describes the key", function () {
          const result = pm.response.json().result;
          pm.expect(result.isError).to.not.eql(true);
          const who = result.structuredContent;
          pm.expect(who.label).to.be.a("string");
          pm.expect(who.scopes).to.be.an("array").that.is.not.empty;
          pm.expect(who.expires_at).to.be.a("string");
          pm.expect(who.operator).to.have.property("email");
          pm.expect(who.operator).to.not.have.property("sub");
      });
