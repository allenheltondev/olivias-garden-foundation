$kind: http-request
name: No Key - 401
description: |-
  Without an Authorization header the endpoint refuses before any MCP handling.
method: POST
url: '{{mcpUrl}}'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: 'application/json, text/event-stream'
  - key: MCP-Protocol-Version
    value: '{{protocolVersion}}'
  - key: Mcp-Method
    value: tools/list
body:
  type: json
  content: |-
    {"jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {"_meta": {"io.modelcontextprotocol/protocolVersion": "{{protocolVersion}}", "io.modelcontextprotocol/clientCapabilities": {}}}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Asks for a bearer key", function () {
          // API Gateway REST APIs pass a Lambda's WWW-Authenticate on as
          // x-amzn-Remapped-WWW-Authenticate.
          const challenge = pm.response.headers.get("WWW-Authenticate")
              || pm.response.headers.get("x-amzn-Remapped-WWW-Authenticate");
          pm.expect(challenge).to.eql("Bearer");
      });

      pm.test("Answers with a JSON-RPC error that names the key format", function () {
          const body = pm.response.json();
          pm.expect(body.jsonrpc).to.eql("2.0");
          pm.expect(body.error.code).to.eql(-32000);
          pm.expect(body.error.message).to.contain("ogfmcp_");
          pm.expect(body).to.not.have.property("result");
      });
