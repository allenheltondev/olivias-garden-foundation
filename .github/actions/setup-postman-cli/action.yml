name: Setup Postman CLI
description: Install the Postman CLI.

# No `postman login`: every collection CI runs is a local folder under
# postman/collections, which the CLI runs without an account. Login is only
# needed for cloud collections referenced by ID, and Postman API keys are no
# longer available on non-Enterprise plans.

runs:
  using: composite
  steps:
    - name: Install Postman CLI
      shell: bash
      run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
