openapi: 3.0.3
info:
  title: Okra API
  version: 0.1.0
  description: API contract for the Okra backend.
paths:
  /photos:
    post:
      operationId: createPhotoUploadIntent
      summary: Create temporary photo record and pre-signed upload URL
      tags:
        - media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contentType
              properties:
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                fileName:
                  type: string
      responses:
        '201':
          description: Upload intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  photoId:
                    type: string
                  uploadUrl:
                    type: string
                  method:
                    type: string
                    example: PUT
                  headers:
                    type: object
                  bucket:
                    type: string
                  s3Key:
                    type: string
                  expiresInSeconds:
                    type: number
        '422':
          description: Validation error
        '429':
          description: Rate limit exceeded

  /requests:
    post:
      operationId: createSeedRequest
      summary: Create a free okra seed request (US/CA mail or in-person exchange)
      tags:
        - requests
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID; repeat submissions with the same key within 24h return the cached result.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - fulfillmentMethod
              properties:
                name:
                  type: string
                  maxLength: 200
                email:
                  type: string
                  format: email
                fulfillmentMethod:
                  type: string
                  enum: [mail, in_person]
                  description: "\"mail\" requires shippingAddress (US or CA only); \"in_person\" uses optional visitDetails."
                shippingAddress:
                  type: object
                  required:
                    - line1
                    - city
                    - region
                    - postalCode
                    - country
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                      enum: [US, CA]
                visitDetails:
                  type: object
                  properties:
                    approximateDate:
                      type: string
                    notes:
                      type: string
                message:
                  type: string
                  maxLength: 2000
                heardAboutUs:
                  type: string
                  enum: [search, social_media, friend_or_family, news_or_blog, event, school_or_community_group, other]
                  description: Optional. How the requester heard about the project; included in the Slack notification.
                showOnMap:
                  type: boolean
                  default: false
                  description: >-
                    Explicit opt-in to showing the requester's first name on
                    their public "seeds sent" map pin. Every mailed request
                    gets a pin once handled; without this it is anonymous
                    (city/region, country and month only). Only honoured for
                    mail fulfillment; omitted means no. New mailed requests
                    also record which map notice they were made under, so the
                    meaning of an unchecked box can't change after the fact.
      responses:
        '201':
          description: Seed request recorded
          content:
            application/json:
              schema:
                type: object
                required:
                  - requestId
                  - createdAt
                properties:
                  requestId:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Missing Idempotency-Key header
        '409':
          description: A request with this Idempotency-Key is already being processed
        '422':
          description: Validation error (e.g. unsupported shipping country)
        '429':
          description: Rate limit exceeded for this source IP

  /submissions:
    post:
      operationId: createSubmission
      summary: Create a pending submission for review and claim uploaded photos
      tags:
        - submissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rawLocationText
                - displayLat
                - displayLng
                - photoIds
              properties:
                contributorName:
                  type: string
                contributorEmail:
                  type: string
                storyText:
                  type: string
                rawLocationText:
                  type: string
                privacyMode:
                  type: string
                  enum: [exact, nearby, neighborhood, city]
                displayLat:
                  type: number
                displayLng:
                  type: number
                photoIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '201':
          description: Submission created
          content:
            application/json:
              schema:
                type: object
                required:
                  - submissionId
                  - status
                properties:
                  submissionId:
                    type: string
                  status:
                    type: string
                    example: pending_review
                  createdAt:
                    type: string
        '422':
          description: Validation error

  /me/submissions:
    get:
      operationId: listMyOkraSubmissions
      summary: List okra submissions owned by the authenticated contributor
      tags:
        - submissions
      responses:
        '200':
          description: Contributor submissions
        '401':
          description: Authentication required

  /me/submissions/{id}:
    patch:
      operationId: editMyOkraSubmission
      summary: Submit edits to an owned okra submission for review
      tags:
        - submissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rawLocationText
                - displayLat
                - displayLng
                - photoIds
              properties:
                contributorName:
                  type: string
                storyText:
                  type: string
                rawLocationText:
                  type: string
                privacyMode:
                  type: string
                  enum: [exact, nearby, neighborhood, city]
                displayLat:
                  type: number
                displayLng:
                  type: number
                photoIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                removePhotoIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                editClientKey:
                  type: string
                  description: Client-generated key used to make edit submission retries idempotent.
                  maxLength: 120
      responses:
        '202':
          description: Edit accepted for review
        '401':
          description: Authentication required
        '404':
          description: Submission not found
        '422':
          description: Validation error

  /okra:
    get:
      operationId: getOkra
      summary: Get all approved submissions as map pins (replaces previous paginated behavior)
      tags:
        - map
      responses:
        '200':
          description: All approved pins with popup data
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=300, stale-while-revalidate=60"
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - data
                properties:
                  total_count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapPin'

  /okra/stats:
    get:
      operationId: getOkraStats
      summary: Get aggregate statistics for approved submissions
      tags:
        - map
      responses:
        '200':
          description: Community statistics
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=300, stale-while-revalidate=60"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkraStats'

  /okra/seed-shipments:
    get:
      operationId: getOkraSeedShipments
      summary: Get map pins for places okra seeds have been mailed
      description: >
        Public-safe projection of handled mail seed requests. Only the
        recipient's first name and city/region are returned; street address,
        postal code, last name, and email are never exposed. Coordinates are
        stored at ~1 km precision and fuzzed within a city-sized radius.
      tags:
        - map
      responses:
        '200':
          description: All seed shipment pins
          headers:
            Cache-Control:
              schema:
                type: string
                example: "public, max-age=300, stale-while-revalidate=60"
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_count
                  - data
                properties:
                  total_count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeedShipmentPin'

  /admin/submissions:
    get:
      operationId: listAdminSubmissions
      summary: List submissions with cursor-based pagination
      tags:
        - admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - pending_review
              - approved
              - denied
          description: >-
            Filter submissions by status. Omit to return every submission
            regardless of status. `pending_review` returns every row in that
            state. `pending` is a queue-semantics alias that maps to
            `pending_review` AND restricts the result to submissions with at
            least one ready photo — use it when you want only the subset the
            moderation UI shows.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Page size (1-100). Values above 100 are clamped to 100.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor token from a previous response.
      responses:
        '200':
          description: Paginated list of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/submissions/{id}/statuses:
    post:
      operationId: transitionSubmissionStatus
      summary: Transition a submission to approved or denied status
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Submission ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusTransitionRequestBody'
      responses:
        '200':
          description: Submission status transitioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusTransitionResponse'
        '400':
          description: Validation error (INVALID_ACTION, INVALID_COORDINATES, INVALID_REASON, MISSING_NOTES, MISSING_PHOTOS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Submission already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/requests:
    get:
      operationId: listAdminSeedRequests
      summary: List seed requests for admin handling
      tags:
        - admin
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum:
              - open
              - handled
              - cancelled
          description: >-
            Filter seed requests by status. Required. `open` is sorted by
            createdAt, `handled` by handledAt, and `cancelled` by cancelledAt,
            newest first.
      responses:
        '200':
          description: Seed requests matching the status filter
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeedRequestQueueItem'
        '400':
          description: Invalid or missing status query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/requests/{id}/statuses:
    post:
      operationId: transitionSeedRequestStatus
      summary: Move a seed request between open, handled, and cancelled
      description: >-
        `handled` (from open) counts a packet sent and, for mailed requests
        with map_location, adds a public map pin (showing the first name only
        if the requester opted in via showOnMap, otherwise anonymous). Every transition is conditional on the request's
        current status and statusVersion; a concurrent change returns 409. `cancelled` (from open)
        closes the request without counting a packet. `open` (from handled
        or cancelled) reopens it; undoing a handled request un-counts the
        packet and removes its map pin.
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Seed request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - handled
                    - cancelled
                    - open
                review_notes:
                  type: string
                  maxLength: 1000
                map_location:
                  type: object
                  description: >
                    Optional approximate (city-level) location used to put a
                    "seeds sent" pin on the public map. Ignored for in-person
                    requests.
                  required: [lat, lng]
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
      responses:
        '200':
          description: Seed request transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedRequestStatusResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Seed request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Seed request is not in a state that allows this transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/requests/{id}/pin-address:
    put:
      operationId: setSeedRequestPinAddress
      summary: Set (or clear) the map address of an in-person seed request
      description: >-
        In-person requests have no shipping address, so they never get a map
        pin on their own. An admin can record where the exchange happened; the
        full address stays private on the request and the public pin only ever
        shows the city and region, anonymously (never a name), at an obscured
        location. Fields are title-cased (state codes upper-cased) before they
        are stored. Changing or clearing the address hides any existing pin at
        the new statusVersion; use the map-pin endpoint to place it again.
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: object
                  nullable: true
                  description: The address, or null to clear it.
                  required: [city, country]
                  properties:
                    line1:
                      type: string
                      maxLength: 200
                    line2:
                      type: string
                      maxLength: 200
                    city:
                      type: string
                      maxLength: 120
                    region:
                      type: string
                      maxLength: 120
                    postalCode:
                      type: string
                      maxLength: 20
                    country:
                      type: string
                      description: Two-letter country code.
                      example: US
      responses:
        '200':
          description: Address saved (or cleared)
          content:
            application/json:
              schema:
                type: object
                required: [id, pinAddress, mapPinRemoved]
                properties:
                  id:
                    type: string
                  pinAddress:
                    type: object
                    nullable: true
                    description: The normalized address as stored.
                  mapPinRemoved:
                    type: boolean
                    nullable: true
                    description: >-
                      Whether a visible pin was hidden (false when there was
                      none, e.g. the request isn't done yet). null means the
                      pin store failed: the address is saved, and the outdated
                      pin is hidden the next time the request list loads.
        '400':
          description: Missing or invalid address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Seed request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Not an in-person request, cancelled, or changed concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/requests/{id}/map-pin:
    post:
      operationId: addSeedRequestMapPin
      summary: Put a done mailed request on the public map
      description: >-
        For requests marked done before pins existed, or whose pin was
        removed. Bumps statusVersion so this write outranks earlier pin
        writes. The pin's month is when the request was handled. Shows the
        first name only if the requester opted in.
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [map_location]
              properties:
                map_location:
                  type: object
                  required: [lat, lng]
                  description: City-level location.
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
      responses:
        '200':
          description: Pin added (mapPin null if a newer state superseded it)
          content:
            application/json:
              schema:
                type: object
                required: [id, mapPin]
                properties:
                  id:
                    type: string
                  mapPin:
                    type: object
                    nullable: true
                    properties:
                      locality:
                        type: string
                        nullable: true
                      country:
                        type: string
                        nullable: true
        '400':
          description: Missing or invalid map_location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Seed request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Request is not done, may not have a pin (an in-person request with
            no map address, or declined under the opt-in-only form), or
            changed concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteSeedRequestMapPin
      summary: Remove a seed request's "seeds sent" pin from the public map
      description: >-
        Leaves the request's status unchanged but bumps its statusVersion so
        the removal outranks any earlier pin write. Idempotent.
      tags:
        - admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: Seed request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request changed concurrently; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Pin removed (or there was none)
          content:
            application/json:
              schema:
                type: object
                required: [id, mapPinRemoved]
                properties:
                  id:
                    type: string
                  mapPinRemoved:
                    type: boolean
        '500':
          description: Pin store unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MapPin:
      type: object
      required:
        - id
        - display_lat
        - display_lng
        - photo_urls
      properties:
        id:
          type: string
          format: uuid
        display_lat:
          type: number
          format: double
        display_lng:
          type: number
          format: double
        contributor_name:
          type: string
          nullable: true
        story_text:
          type: string
          nullable: true
        photo_urls:
          type: array
          items:
            type: string
            format: uri

    SeedShipmentPin:
      type: object
      required:
        - id
        - display_lat
        - display_lng
      properties:
        id:
          type: string
        display_lat:
          type: number
          format: double
        display_lng:
          type: number
          format: double
        first_name:
          type: string
          nullable: true
          description: Null for anonymous pins (requester did not opt in to showing a name).
        locality:
          type: string
          nullable: true
          description: City and region, e.g. "Austin, TX"
        country:
          type: string
          nullable: true
        sent_month:
          type: string
          nullable: true
          description: Year and month the seeds were sent (YYYY-MM)

    OkraStats:
      type: object
      required:
        - total_pins
        - country_count
        - contributor_count
      properties:
        total_pins:
          type: integer
        country_count:
          type: integer
        contributor_count:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: INVALID_STATUS
            message:
              type: string
              description: Human-readable error message
              example: Invalid status parameter

    SubmissionListItem:
      type: object
      required:
        - id
        - privacy_mode
        - status
        - created_at
        - photo_count
        - has_photos
        - photos
      properties:
        id:
          type: string
          format: uuid
        contributor_name:
          type: string
          nullable: true
        contributor_email:
          type: string
          nullable: true
        story_text:
          type: string
          nullable: true
        raw_location_text:
          type: string
          nullable: true
        privacy_mode:
          type: string
        display_lat:
          type: number
          format: double
          nullable: true
        display_lng:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum:
            - pending_review
            - approved
            - denied
        created_at:
          type: string
          format: date-time
        photo_count:
          type: integer
          description: Number of photos associated with this submission
        has_photos:
          type: boolean
          description: Whether the submission has at least one photo
        photos:
          type: array
          items:
            type: string
            format: uri
          description: Pre-signed S3 URLs for submission photos

    SubmissionListResponse:
      type: object
      required:
        - data
        - cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionListItem'
        cursor:
          type: string
          nullable: true
          description: Opaque cursor token for the next page, or null if no more results

    Submission:
      type: object
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        contributor_name:
          type: string
          nullable: true
        story_text:
          type: string
          nullable: true
        raw_location_text:
          type: string
          nullable: true
        privacy_mode:
          type: string
        display_lat:
          type: number
          format: double
          nullable: true
        display_lng:
          type: number
          format: double
          nullable: true
        status:
          type: string
          enum:
            - pending_review
            - approved
            - denied
        review_notes:
          type: string
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    StatusTransitionRequestBody:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - approved
            - denied
          description: Target status for the submission
        review_notes:
          type: string
          description: Optional notes from the reviewer
        display_lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Override latitude for pin adjustment (approval only)
        display_lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Override longitude for pin adjustment (approval only)
        reason:
          type: string
          enum:
            - spam
            - invalid_location
            - inappropriate
            - other
          description: Structured denial reason (required when status is denied)

    StatusTransitionResponse:
      allOf:
        - $ref: '#/components/schemas/Submission'
        - type: object
          properties:
            warnings:
              type: array
              items:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: string
                    example: SUSPICIOUS_COORDINATES
                  message:
                    type: string
                    example: "Coordinates are at 0,0 -- verify location is correct"

    SeedRequestQueueItem:
      type: object
      required:
        - id
        - requestStatus
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        fulfillmentMethod:
          type: string
          enum: [mail, in_person]
          nullable: true
        shippingAddress:
          type: object
          nullable: true
          properties:
            line1:
              type: string
            line2:
              type: string
            city:
              type: string
            region:
              type: string
            postalCode:
              type: string
            country:
              type: string
        visitDetails:
          type: object
          nullable: true
          properties:
            approximateDate:
              type: string
            notes:
              type: string
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        requestStatus:
          type: string
          enum: [open, handled, cancelled]
        handledAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        showOnMap:
          type: boolean
          description: The requester opted in to their first name appearing on their map pin.
        pinVisibility:
          type: string
          enum: [named, anonymous, none]
          description: >-
            What public pin the request may have, based on the map notice it
            was made under. `none` covers in-person requests and requests made
            under the opt-in-only form that left the box unchecked (they were
            told no pin would be shown). Requests from before any map notice
            may have anonymous pins. In-person requests are `anonymous` once
            an admin sets a `pinAddress`, otherwise `none`.
        pinAddress:
          type: object
          nullable: true
          description: >-
            Admin-set, private address for an in-person exchange's map pin.
            Only city and region are ever published.
        statusVersion:
          type: integer
          description: >-
            Incremented on every admin change to the request. Pin writes on
            the public map carry this version so the newest state wins.
        reviewNotes:
          type: string
          nullable: true
        mapPin:
          type: object
          nullable: true
          description: >-
            Public "seeds sent" pin for this request, or null when there is
            none. Omitted when pin status could not be loaded.
          properties:
            locality:
              type: string
              nullable: true
            country:
              type: string
              nullable: true

    SeedRequestStatusResponse:
      type: object
      required:
        - id
        - requestStatus
      properties:
        id:
          type: string
        requestStatus:
          type: string
          enum: [open, handled, cancelled]
        previousStatus:
          type: string
          enum: [handled, cancelled]
          description: Only on reopen
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        reopenedAt:
          type: string
          format: date-time
          nullable: true
        mapPinRemoved:
          type: boolean
          nullable: true
          description: Only on reopen; null if pin removal failed
        handledAt:
          type: string
          format: date-time
          nullable: true
        handledByCognitoSub:
          type: string
          nullable: true
        reviewNotes:
          type: string
          nullable: true
        mapPin:
          type: object
          nullable: true
          description: Public pin created for this request, or null when none was created
          properties:
            locality:
              type: string
              nullable: true
            country:
              type: string
              nullable: true

